    introFlow.addEventListener('click',e=>{if(e.target.closest('[data-intro-start]')){beginNewGame();return}if(e.target.closest('[data-intro-continue]')){continueGame();return}if(e.target.closest('[data-intro-title]')){renderTitle();return}if(e.target.closest('[data-intro-back]')){renderIntroStep(introSlides().length-1);return}if(e.target.closest('[data-intro-confirm]')){confirmPlayerName();return}if(e.target.closest('[data-intro-next]')){introStep<introSlides().length-1?renderIntroStep(introStep+1):renderNameEntry()}});
    evaluationScene.addEventListener('click',advanceEvaluation);evaluationScene.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();advanceEvaluation()}});
    modalBox.addEventListener('click',e=>{
      if(e.target.closest('[data-close]')){if((currentModal==='report'||currentModal==='log')&&pendingStoryEvent){finishQuarterReport();return}closeModal();return}
      if(e.target.id==='finishQuarterReport'){finishQuarterReport();return}
      if(e.target.id==='finishProjectCompletion'){finishProjectCompletion();return}
      const storyChoice=e.target.closest('[data-story-choice]');if(storyChoice){resolveYearStoryChoice(storyChoice.dataset.storyChoice);return}
      if(e.target.id==='finishStoryEvent'){(state.projectCompletionQueue||[]).length?openProjectCompletion('story'):(state.calendarYear>=2040?openEnding():closeModal());return}
      const group=e.target.closest('[data-plan-group]');if(group){planGroup=group.dataset.planGroup;planPage=0;renderPlan();return}
      const page=e.target.closest('[data-plan-page]');if(page&&!page.disabled){planPage=Math.max(0,Number(page.dataset.planPage)||0);renderPlan();return}
      const select=e.target.closest('[data-select-project]');if(select){selectedPlanProject=selectedPlanProject===select.dataset.selectProject?'':select.dataset.selectProject;renderPlan();return}
      const mobileTile=e.target.closest('.project-tile[data-project-id]');if(mobileTile&&!e.target.closest('button')&&window.matchMedia('(max-width:720px) and (orientation:portrait)').matches){selectedPlanProject=selectedPlanProject===mobileTile.dataset.projectId?'':mobileTile.dataset.projectId;renderPlan();return}
      const zone=e.target.closest('.month-zone[data-month-key]');if(zone&&!e.target.closest('[data-remove-project]')&&selectedPlanProject){scheduleProject(selectedPlanProject,zone.dataset.monthKey);return}
      const remove=e.target.closest('[data-remove-project]');if(remove){quarterDraft[remove.dataset.monthKey]=(quarterDraft[remove.dataset.monthKey]||[]).filter(id=>id!==remove.dataset.removeProject);renderPlan();return}
      if(e.target.id==='savePlan'){const issue=planPreflight();if(issue){toast(issue);return}const months=quarterMonths();state.quarterPlan={...(state.quarterPlan||{})};months.forEach(x=>state.quarterPlan[x.key]=[...(quarterDraft[x.key]||[])]);const complete=months.every(x=>state.quarterPlan[x.key].length===1);state.logs.push({date:dateText(),title:'更新季度安排',text:months.map(x=>`${x.calendarYear}年${x.month}月：${state.quarterPlan[x.key].map(id=>projectById(id)?.name).filter(Boolean).join('、')||'待安排'}`).join('；')});closeModal();updateHUD();toast(complete?'季度安排已保存，可以推进':'已保存草稿，仍需补齐空白月份')}
      const detail=e.target.closest('[data-project-detail]');if(detail){openProjectDetail(detail.dataset.projectDetail,detail.dataset.detailReturn||'plan');return}
      const detailBack=e.target.closest('[data-detail-back]');if(detailBack){projectDetailReturn=detailBack.dataset.detailBack||'plan';returnFromProjectDetail();return}
      const cgDetail=e.target.closest('[data-cg-detail]');if(cgDetail){openCgDetail(cgDetail.dataset.cgDetail);return}
      if(e.target.closest('[data-cg-back]')){openManual('cg');return}
      const manage=e.target.closest('[data-manage-project]');if(manage){doManagementProject(manage.dataset.manageProject);return}
      const action=e.target.closest('[data-action]');if(action){action.dataset.action==='chat'?openChatTargets():doAction(action.dataset.action)}
      const chatTarget=e.target.closest('[data-chat-target]');if(chatTarget)doChat(chatTarget.dataset.chatTarget);
      if(e.target.id==='backToActions')openActions();
      if(e.target.id==='startEvaluation'){evaluationIndex=0;renderEvaluationLine();return}
      const tab=e.target.closest('[data-tab]');if(tab)openManual(tab.dataset.tab);
      if(e.target.id==='saveNow'){saveLocal('greenFactorySave');openSave()}if(e.target.id==='loadNow')loadLocal('greenFactorySave');if(e.target.id==='loadAuto')loadLocal('greenFactoryAuto');
      if(e.target.id==='resetGame'){const keepSettings={...state.settings};state=JSON.parse(JSON.stringify(defaultState));state.settings=keepSettings;localStorage.removeItem('greenFactoryAuto');localStorage.removeItem('greenFactorySave');applySettings();updateHUD();closeModal();renderTitle();toast('演示数据已重置')}
      if(e.target.id==='saveSettings'){state.settings.sound=$('#soundToggle').checked;state.settings.motion=$('#motionToggle').checked;state.settings.scale=Number($('#scaleRange').value);applySettings();closeModal();toast('设置已应用')}
      if(e.target.id==='openLogFromReport')openLog();
    });
    function clearDragVisuals(){document.querySelectorAll('.drag-over,.dragging').forEach(el=>el.classList.remove('drag-over','dragging'));document.querySelector('.drag-ghost')?.remove()}
    modalBox.addEventListener('dragstart',e=>{const tile=e.target.closest('[data-project-id]');if(!tile||currentModal!=='plan')return;const data={id:tile.dataset.projectId,source:tile.dataset.sourceMonth||''};tile.classList.add('dragging');e.dataTransfer.effectAllowed=data.source?'move':'copy';e.dataTransfer.setData('application/json',JSON.stringify(data));e.dataTransfer.setData('text/plain',data.id)});
    modalBox.addEventListener('dragend',clearDragVisuals);
    modalBox.addEventListener('dragover',e=>{const zone=e.target.closest('.month-zone');if(!zone||currentModal!=='plan')return;e.preventDefault();e.dataTransfer.dropEffect='move';document.querySelectorAll('.month-zone.drag-over').forEach(z=>{if(z!==zone)z.classList.remove('drag-over')});zone.classList.add('drag-over')});
    modalBox.addEventListener('dragleave',e=>{const zone=e.target.closest('.month-zone');if(zone&&!zone.contains(e.relatedTarget))zone.classList.remove('drag-over')});
    modalBox.addEventListener('drop',e=>{const zone=e.target.closest('.month-zone');if(!zone||currentModal!=='plan')return;e.preventDefault();let data={id:e.dataTransfer.getData('text/plain'),source:''};try{data=JSON.parse(e.dataTransfer.getData('application/json')||'')}catch(err){}clearDragVisuals();if(data.id)scheduleProject(data.id,zone.dataset.monthKey,data.source||'')});
    modalBox.addEventListener('pointerdown',e=>{const handle=e.target.closest('[data-drag-project]');if(!handle||currentModal!=='plan'||e.button!==0||e.target.closest('.project-buttons,[data-remove-project]')||window.matchMedia('(pointer:coarse)').matches)return;e.preventDefault();const p=projectById(handle.dataset.dragProject);if(!p)return;pointerDrag={id:p.id,source:handle.dataset.dragSource||'',pointerId:e.pointerId,moved:false,x:e.clientX,y:e.clientY,label:p.name,handle};handle.setPointerCapture?.(e.pointerId)});
    modalBox.addEventListener('pointermove',e=>{if(!pointerDrag||e.pointerId!==pointerDrag.pointerId)return;const distance=Math.hypot(e.clientX-pointerDrag.x,e.clientY-pointerDrag.y);if(distance<5&&!pointerDrag.moved)return;pointerDrag.moved=true;let ghost=document.querySelector('.drag-ghost');if(!ghost){ghost=document.createElement('div');ghost.className='drag-ghost';ghost.textContent=pointerDrag.label;document.body.appendChild(ghost);pointerDrag.handle.closest('[data-project-id]')?.classList.add('dragging')}ghost.style.left=`${e.clientX}px`;ghost.style.top=`${e.clientY}px`;const zone=document.elementFromPoint(e.clientX,e.clientY)?.closest('.month-zone');document.querySelectorAll('.month-zone.drag-over').forEach(z=>{if(z!==zone)z.classList.remove('drag-over')});zone?.classList.add('drag-over')});
    function finishPointerDrag(e){if(!pointerDrag||e.pointerId!==pointerDrag.pointerId)return;const drag=pointerDrag,zone=drag.moved?document.elementFromPoint(e.clientX,e.clientY)?.closest('.month-zone'):null;pointerDrag=null;clearDragVisuals();if(zone)scheduleProject(drag.id,zone.dataset.monthKey,drag.source);else if(drag.moved)toast('请把项目放到一个月份框内')}
    modalBox.addEventListener('pointerup',finishPointerDrag);modalBox.addEventListener('pointercancel',e=>{if(pointerDrag&&e.pointerId===pointerDrag.pointerId){pointerDrag=null;clearDragVisuals()}});
    body.addEventListener('input',e=>{if(e.target.id==='scaleRange')$('#scaleValue').textContent=e.target.value});
    window.addEventListener('resize',syncMainLayout);
    updateHUD();applySettings();renderTitle();
  })();
  </script>
</body>
